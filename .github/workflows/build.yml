# Builds the Windows installer and the Linux program on every push to main and publishes them
# on the Releases page as version v<VERSION file>. To release a new version, change VERSION and push.
name: Build Techmiary Sales
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Build TechmiarySales.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name TechmiarySales
          --icon assets/techmiary.ico
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          main.py
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Get-Content VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\TechmiarySales.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TechmiarySales-Windows
          path: |
            dist/TechmiarySales-Setup.exe
            dist/TechmiarySales.exe
      - name: Read version
        shell: bash
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Techmiary Sales Manager v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** download `TechmiarySales-Setup.exe` and run it. If Windows says "Windows protected your PC", click **More info → Run anyway**.
            **Linux:** download `TechmiarySales-Linux.tar.gz`, extract it, then run `./install_linux.sh` (or `./TechmiarySales`).
          files: |
            dist/TechmiarySales-Setup.exe
            dist/TechmiarySales.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Build TechmiarySales (Linux)
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name TechmiarySales
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          main.py
      - name: Package
        run: |
          mkdir -p TechmiarySales-Linux/assets
          cp dist/TechmiarySales install_linux.sh README.md TechmiarySales-Linux/
          cp assets/techmiary.png TechmiarySales-Linux/assets/
          tar czf TechmiarySales-Linux.tar.gz TechmiarySales-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: TechmiarySales-Linux
          path: TechmiarySales-Linux.tar.gz
      - name: Read version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Techmiary Sales Manager v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: TechmiarySales-Linux.tar.gz
